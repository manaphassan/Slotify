name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # CI has no private family profile, so the committed demo profile is compiled.
      # Without signing secrets the release build is unsigned (see MASTER_DOCUMENTATION §12).
      - name: Unit tests, lint and release build
        run: ./gradlew -PslotifyProfile=demo testDebugUnitTest lintDebug assembleRelease --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            app/build/reports/
          retention-days: 14
